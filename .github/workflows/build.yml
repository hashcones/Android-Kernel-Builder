name: Build GKI Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-kernel:
    name: Build Kernel via Kleaf
    runs-on: ubuntu-latest

    env:
      TARGET_GKI_MANIFEST: "https://android.googlesource.com/kernel/manifest"
      REPO_BRANCH: "common-android14-6.1"
      BAZEL_TARGET: "//common:kernel_aarch64_dist"
      ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            ca-certificates \
            python3 \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            pahole \
            ccache

          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install official repo launcher
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/bin"

          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/git-repo-downloads/repo" \
            --output "$GITHUB_WORKSPACE/bin/repo"

          chmod 0755 "$GITHUB_WORKSPACE/bin/repo"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/bin/repo" --version
          python3 --version
          git --version

      - name: Initialize GKI source tree
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$GITHUB_WORKSPACE/android-kernel"
          mkdir -p "$GITHUB_WORKSPACE/android-kernel"
          cd "$GITHUB_WORKSPACE/android-kernel"

          repo init \
            --manifest-url="$TARGET_GKI_MANIFEST" \
            --manifest-branch="$REPO_BRANCH" \
            --depth=1 \
            --no-clone-bundle

      - name: Sync GKI source tree
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/android-kernel"

          repo sync \
            --current-branch \
            --jobs=2 \
            --no-tags \
            --no-clone-bundle \
            --force-sync \
            --fail-fast

          test -d common || {
            echo "::error::repo sync completed without creating android-kernel/common"
            find . -maxdepth 2 -type d | sort | head -100
            exit 1
          }

          test -f common/BUILD.bazel || {
            echo "::error::android-kernel/common/BUILD.bazel is missing"
            exit 1
          }

      - name: Apply NetHunter-compatible kernel configuration
        shell: bash
        working-directory: android-kernel/common
        run: |
          set -Eeuo pipefail

          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          test -f "$CONFIG_FILE" || {
            echo "::error::Missing $CONFIG_FILE"
            exit 1
          }

          # These are configuration-only changes. No legacy NetHunter patch
          # repository or device-specific source patches are used.
          set_config() {
            local key="$1"
            local value="$2"

            if ! grep -RqsE "^[[:space:]]*(menuconfig[[:space:]]+|config[[:space:]]+)${key#CONFIG_}([[:space:]]|$)" \
                --include='Kconfig' \
                --include='Kconfig.*' \
                .; then
              echo "::warning::${key} is not declared by this kernel tree; skipping"
              return 0
            fi

            sed -i \
              -e "/^${key}=/d" \
              -e "/^# ${key} is not set$/d" \
              "$CONFIG_FILE"

            printf '%s=%s\n' "$key" "$value" >> "$CONFIG_FILE"
            echo "Enabled ${key}=${value}"
          }

          set_config CONFIG_SYSVIPC y
          set_config CONFIG_BINFMT_MISC y
          set_config CONFIG_CFG80211 m
          set_config CONFIG_MAC80211 m
          set_config CONFIG_USB_G_ANDROID y
          set_config CONFIG_USB_F_HID y
          set_config CONFIG_USB_CONFIGFS y
          set_config CONFIG_USB_CONFIGFS_F_HID y

          echo "Final NetHunter-related configuration entries:"
          grep -E '^CONFIG_(SYSVIPC|BINFMT_MISC|CFG80211|MAC80211|USB_G_ANDROID|USB_F_HID|USB_CONFIGFS)' \
            "$CONFIG_FILE" || true

      - name: Build with Bazel/Kleaf
        shell: bash
        working-directory: android-kernel
        run: |
          set -Eeuo pipefail

          echo "Starting Bazel build for target: $BAZEL_TARGET"

          tools/bazel build \
            --//common:gki_certification=false \
            "$BAZEL_TARGET"

      - name: Locate kernel image and modules
        id: kernel-artifacts
        shell: bash
        working-directory: android-kernel
        run: |
          set -Eeuo pipefail

          KERNEL_IMAGE="$(find bazel-bin -type f -name Image -print -quit)"

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No kernel Image was produced"
            find bazel-bin -type f | head -100 || true
            exit 1
          fi

          echo "Kernel image found at: $KERNEL_IMAGE"
          echo "path=$KERNEL_IMAGE" >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/kernel-modules"
          find bazel-bin -type f \( -name '*.ko' -o -name 'modules.load' -o -name 'modules.dep' \) \
            -exec cp --parents '{}' "$GITHUB_WORKSPACE/kernel-modules" \; || true

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf AnyKernel3
          git clone --depth=1 "$ANYKERNEL_REPO" AnyKernel3

          cp \
            "android-kernel/${{ steps.kernel-artifacts.outputs.path }}" \
            AnyKernel3/Image

          cd AnyKernel3
          zip -r9 ../AnyKernel3-NetHunter-config-kernel.zip . -x '.git/*'

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-config-kernel
          path: |
            android-kernel/${{ steps.kernel-artifacts.outputs.path }}
            kernel-modules
          if-no-files-found: error

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-NetHunter-config-kernel
          path: AnyKernel3-NetHunter-config-kernel.zip
          if-no-files-found: error
