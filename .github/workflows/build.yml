name: Build GKI Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel via Kleaf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Clean Environment & Install Dependencies
        run: |
          # Remove conflicting packages and install Bazel/Repo prerequisites
          sudo apt-get update
          sudo apt-get install -y jq git curl python3 python-is-python3
          
          # Install Google's 'repo' tool
          mkdir -p ~/.bin
          curl https://googleapis.com > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

          # Configure Git Identity (Required for repo sync)
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize & Sync Kernel Source (GKI)
        run: |
          # 1. Parse variables from repos.json using jq
          REPO_URL=$(jq -r '.[0].repo // "https://googlesource.com"' repos.json)
          REPO_BRANCH=$(jq -r '.[0].branch // "common-android14-6.1"' repos.json)
          
          echo "Initializing repo from: $REPO_URL on branch: $REPO_BRANCH"
          
          # 2. Create workspace and sync
          mkdir -p android-kernel
          cd android-kernel
          
          # Initialize the Google GKI Manifest
          repo init -u "$REPO_URL" -b "$REPO_BRANCH" --depth=1
          
          # Sync the tree (This takes time and space)
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Apply NetHunter Patch & Configs
        run: |
          cd android-kernel/common
          
          # Check if NetHunter patching is requested in repos.json
          DO_PATCH=$(jq -r '.[0].nethunter_patch // false' $GITHUB_WORKSPACE/repos.json)
          
          if [ "$DO_PATCH" = "true" ]; then
              echo "Downloading and applying NetHunter patches..."
              git clone https://gitlab.com
              cd kali-nethunter-kernel
              # Execute patch script targeting the 'common' directory (parent of current)
              ./patch.sh ..
              cd ..
          fi

          # Append extra configs from repos.json to gki_defconfig
          # Using a temporary file to read the array from JSON
          jq -r '.[0].extra_configs[]' $GITHUB_WORKSPACE/repos.json > extra_configs.txt
          
          echo "Appending the following configurations to arch/arm64/configs/gki_defconfig:"
          cat extra_configs.txt
          
          cat extra_configs.txt >> arch/arm64/configs/gki_defconfig
          
          # Clean up
          rm extra_configs.txt

      - name: Build with Bazel (Kleaf)
        working-directory: android-kernel
        run: |
          # Extract build target from repos.json or default to arm64_dist
          BAZEL_TARGET=$(jq -r '.[0].bazel_target // "//common:kernel_aarch64_dist"' $GITHUB_WORKSPACE/repos.json)
          GKI_OVERRIDE=$(jq -r '.[0].gki_certification_override // true' $GITHUB_WORKSPACE/repos.json)
          
          FLAGS=""
          if [ "$GKI_OVERRIDE" = "true" ]; then
             FLAGS="--//common:gki_certification=false"
          fi

          echo "Starting Bazel build for target: $BAZEL_TARGET with flags: $FLAGS"
          
          # Run the hermetic build
          tools/bazel build $FLAGS $BAZEL_TARGET

      - name: Prepare AnyKernel3 Packaging
        run: |
          # Clone AnyKernel3
          git clone https://github.com
          
          # Locate the compiled Image (Bazel outputs are deep in bazel-bin)
          # We look for Image or Image.lz4 in the distribution directory
          KERNEL_IMAGE=$(find android-kernel/bazel-bin -name "Image" -type f | head -n 1)
          
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: Compiled Kernel Image not found!"
            exit 1
          fi
          
          echo "Found kernel image at: $KERNEL_IMAGE"
          
          # Copy image to AnyKernel3 folder
          cp "$KERNEL_IMAGE" AnyKernel3/
          
          # Zip it up
          cd AnyKernel3
          zip -r9 ../AnyKernel3-NetHunter-GKI.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-NetHunter-GKI
          path: AnyKernel3-NetHunter-GKI.zip
          
