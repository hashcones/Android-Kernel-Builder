name: Build GKI Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-kernel:
    name: Build Kernel via Kleaf
    runs-on: ubuntu-latest

    env:
      TARGET_GKI_MANIFEST: "https://android.googlesource.com/kernel/manifest"
      REPO_BRANCH: "common-android14-6.1"
      BAZEL_TARGET: "//common:kernel_aarch64_dist"

      # Replace this with the NetHunter patch repository required by your target.
      NETHUNTER_PATCH_REPO: "https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git"

      ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            ca-certificates \
            python3 \
            python3-venv \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libffi-dev \
            pahole \
            ccache

          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install official repo launcher
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/bin"

          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/git-repo-downloads/repo" \
            --output "$GITHUB_WORKSPACE/bin/repo"

          chmod 0755 "$GITHUB_WORKSPACE/bin/repo"

          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/bin/repo" --version
          python3 --version
          git --version

      - name: Initialize GKI source tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/android-kernel"
          mkdir -p "$GITHUB_WORKSPACE/android-kernel"

          cd "$GITHUB_WORKSPACE/android-kernel"

          repo init \
            --manifest-url="$TARGET_GKI_MANIFEST" \
            --manifest-branch="$REPO_BRANCH" \
            --depth=1 \
            --no-clone-bundle

      - name: Sync GKI source tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/android-kernel"

          # Start with low concurrency so transient HTTPS failures do not
          # create hundreds of failing Python SSL worker threads.
          repo sync \
            --current-branch \
            --jobs=2 \
            --no-tags \
            --no-clone-bundle \
            --force-sync \
            --fail-fast

          if [ ! -d "common" ]; then
            echo "::error::repo sync completed without creating android-kernel/common"
            echo "Current repository contents:"
            find . -maxdepth 2 -type d | sort | head -100
            exit 1
          fi

          if [ ! -f "common/BUILD.bazel" ]; then
            echo "::error::The common directory exists, but common/BUILD.bazel is missing"
            exit 1
          fi

          echo "GKI source tree successfully synchronized."
          echo "Kernel source: $GITHUB_WORKSPACE/android-kernel/common"

      - name: Apply NetHunter patch and configuration
        shell: bash
        working-directory: android-kernel/common
        run: |
          set -euxo pipefail

          rm -rf kali-nethunter-kernel

          git clone \
            --depth=1 \
            "$NETHUNTER_PATCH_REPO" \
            kali-nethunter-kernel

          if [ ! -x "kali-nethunter-kernel/patch.sh" ]; then
            echo "::error::The NetHunter repository does not contain an executable patch.sh"
            find kali-nethunter-kernel -maxdepth 2 -type f -print
            exit 1
          fi

          ./kali-nethunter-kernel/patch.sh ..

          CONFIG_FILE="arch/arm64/configs/gki_defconfig"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Unable to find $CONFIG_FILE"
            exit 1
          fi

          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_BINFMT_MISC=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_CFG80211_WEXT=y
          CONFIG_USB_G_ANDROID=y
          CONFIG_USB_F_HID=y
          CONFIG_USB_CONFIGFS_F_HID=y
          EOF

          echo "NetHunter patch and configuration completed."

      - name: Build with Bazel/Kleaf
        shell: bash
        working-directory: android-kernel
        run: |
          set -euxo pipefail

          echo "Starting Bazel build for target: $BAZEL_TARGET"

          tools/bazel build \
            --//common:gki_certification=false \
            "$BAZEL_TARGET"

      - name: Locate kernel image
        id: kernel-image
        shell: bash
        working-directory: android-kernel
        run: |
          set -euo pipefail

          KERNEL_IMAGE="$(find bazel-bin -type f -name Image -print -quit)"

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No kernel Image was produced"
            find bazel-bin -type f | head -100 || true
            exit 1
          fi

          echo "Kernel image found at: $KERNEL_IMAGE"
          echo "path=$KERNEL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            "$ANYKERNEL_REPO" \
            AnyKernel3

          cp \
            "android-kernel/${{ steps.kernel-image.outputs.path }}" \
            AnyKernel3/Image

          cd AnyKernel3

          zip -r9 \
            "../AnyKernel3-NetHunter-GKI.zip" \
            . \
            -x ".git/*"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-NetHunter-GKI
          path: AnyKernel3-NetHunter-GKI.zip
          if-no-files-found: error
