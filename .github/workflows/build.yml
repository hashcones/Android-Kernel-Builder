name: Build GKI Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel via Kleaf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      # Named uniquely to completely prevent 'repo' from intercepting internal variables
      TARGET_GKI_MANIFEST: "https://googlesource.com"
      REPO_BRANCH: "common-android14-6.1"
      BAZEL_TARGET: "//common:kernel_aarch64_dist"

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Clean Environment & Build Python 2 Fallback Bridge
        run: |
          sudo apt-get update
          
          # Force purge any broken apt-managed binary instances
          sudo apt-get remove -y repo || true
          sudo apt-get purge -y repo || true
          
          # Install core prerequisites needed for GKI builds and Python compilation
          sudo apt-get install -y git curl python3 rsync build-essential libssl-dev libffi-dev
          
          # --- MANDATORY PYTHON 2 FALLBACK BRIDGING ---
          echo "Compiling and deploying Python 2 structure to intercept environment variables..."
          mkdir -p $GITHUB_WORKSPACE/py2-core
          cd $GITHUB_WORKSPACE/py2-core
          
          # Pull down stable final release tree directly from official source archives
          wget --quiet https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          
          # Configure and execute multi-threaded compilation target
          ./configure --prefix=$GITHUB_WORKSPACE/py2-bin --enable-optimizations > /dev/null
          make -j$(nproc) > /dev/null
          make install > /dev/null
          
          # Construct symbolic link bridges to intercept both generic mapping signatures
          ln -sf $GITHUB_WORKSPACE/py2-bin/bin/python2.7 $GITHUB_WORKSPACE/py2-bin/bin/python
          ln -sf $GITHUB_WORKSPACE/py2-bin/bin/python2.7 $GITHUB_WORKSPACE/py2-bin/bin/python2
          
          # Configure automated developer identity requirements
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize & Sync Kernel Source (GKI)
        run: |
          # Push our custom Python 2 compilation pool to the absolute front of the system path execution order
          export PATH="$GITHUB_WORKSPACE/py2-bin/bin:$PATH"
          
          echo "Verifying environment binary tracking intercept maps:"
          python --version
          
          # Provision local directory structure
          mkdir -p $GITHUB_WORKSPACE/bin
          
          # Fetch pristine un-compiled wrapper script natively from Google Gerrit tree mirrors
          curl -s https://googlesource.com | base64 --decode > $GITHUB_WORKSPACE/bin/repo
          chmod a+x $GITHUB_WORKSPACE/bin/repo
          
          # Set up separate project architecture storage workspace
          mkdir -p android-kernel
          cd android-kernel
          
          # Execute initialization explicitly using Python 2 layer to process execution loops
          python $GITHUB_WORKSPACE/bin/repo init \
            -u "${{ env.TARGET_GKI_MANIFEST }}" \
            -b "${{ env.REPO_BRANCH }}" \
            --depth=1 \
            --repo-url=https://googlesource.com \
            --repo-branch=stable
          
          # Perform direct shallow synchronization sequence
          python $GITHUB_WORKSPACE/bin/repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Apply NetHunter Patch & Configs
        run: |
          if [ ! -d "android-kernel/common" ]; then
            echo "Error: The Google GKI repo sync did not complete successfully or common directory is missing."
            exit 1
          fi

          cd android-kernel/common
          
          echo "Downloading and applying Kali NetHunter patches..."
          git clone https://gitlab.com
          cd kali-nethunter-kernel
          ./patch.sh ..
          cd ..

          echo "Injecting NetHunter configurations into gki_defconfig..."
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_SYSVIPC=y
          CONFIG_BINFMT_MISC=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_CFG80211_WEXT=y
          CONFIG_USB_G_ANDROID=y
          CONFIG_USB_F_HID=y
          CONFIG_USB_CONFIGFS_F_HID=y
          EOF
          
          echo "Successfully appended configurations to arch/arm64/configs/gki_defconfig"

      - name: Build with Bazel (Kleaf)
        working-directory: android-kernel
        run: |
          echo "Starting Hermetic Bazel build for target: ${{ env.BAZEL_TARGET }}"
          
          # Run compilation bypassing Google certification to allow custom drivers
          tools/bazel build --//common:gki_certification=false ${{ env.BAZEL_TARGET }}

      - name: Prepare AnyKernel3 Packaging
        run: |
          git clone https://github.com
          
          KERNEL_IMAGE=$(find android-kernel/bazel-bin -name "Image" -type f | head -n 1)
          
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: Compiled Kernel Image binary structure could not be found!"
            exit 1
          fi
          
          echo "Found kernel image target path at: $KERNEL_IMAGE"
          
          cp "$KERNEL_IMAGE" AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../AnyKernel3-NetHunter-GKI.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-NetHunter-GKI
          path: AnyKernel3-NetHunter-GKI.zip
          
