name: Build GKI Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel via Kleaf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      REPO_URL: "https://googlesource.com"
      REPO_BRANCH: "common-android14-6.1"
      BAZEL_TARGET: "//common:kernel_aarch64_dist"

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          
          # CRITICAL FOR FIXING THE LOOP: We completely remove any hidden, broken pre-packaged repo configs
          sudo apt-get remove -y repo || true
          sudo apt-get purge -y repo || true
          
          # Install clean foundational software utilities
          sudo apt-get install -y git curl python3 python-is-python3 rsync
          
          # Configure Git Identity (Strict requirement for repo processing loops)
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize & Sync Kernel Source (GKI)
        run: |
          echo "Initializing repo from: ${{ env.REPO_URL }} on branch: ${{ env.REPO_BRANCH }}"
          
          # Create an explicit local directory structure
          mkdir -p $GITHUB_WORKSPACE/bin
          
          # Pull the authentic, un-compiled Python engine wrapper cleanly from Google Gerrit
          curl -s https://googlesource.com | base64 --decode > $GITHUB_WORKSPACE/bin/repo
          chmod a+x $GITHUB_WORKSPACE/bin/repo
          
          # Prepend our clean local bin path right to the front of the tracking order
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          
          # Form the kernel building workspace
          mkdir -p android-kernel
          cd android-kernel
          
          # Force python to strictly execute our targeted binary directly, completely bypassing system overrides
          python3 $GITHUB_WORKSPACE/bin/repo init -u "${{ env.REPO_URL }}" -b "${{ env.REPO_BRANCH }}" --depth=1 --repo-url=https://gerrit.googlesource.com/git-repo
          
          # Execute source synchronization download 
          python3 $GITHUB_WORKSPACE/bin/repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Apply NetHunter Patch & Configs
        run: |
          if [ ! -d "android-kernel/common" ]; then
            echo "Error: The Google GKI repo sync did not complete successfully or common directory is missing."
            exit 1
          fi

          cd android-kernel/common
          
          echo "Downloading and applying Kali NetHunter patches..."
          git clone https://gitlab.com
          cd kali-nethunter-kernel
          ./patch.sh ..
          cd ..

          echo "Injecting NetHunter configurations into gki_defconfig..."
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_SYSVIPC=y
          CONFIG_BINFMT_MISC=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_CFG80211_WEXT=y
          CONFIG_USB_G_ANDROID=y
          CONFIG_USB_F_HID=y
          CONFIG_USB_CONFIGFS_F_HID=y
          EOF
          
          echo "Successfully appended configurations to arch/arm64/configs/gki_defconfig"

      - name: Build with Bazel (Kleaf)
        working-directory: android-kernel
        run: |
          echo "Starting Hermetic Bazel build for target: ${{ env.BAZEL_TARGET }}"
          
          # Run compilation bypassing Google certification to allow custom drivers
          tools/bazel build --//common:gki_certification=false ${{ env.BAZEL_TARGET }}

      - name: Prepare AnyKernel3 Packaging
        run: |
          git clone https://github.com
          
          KERNEL_IMAGE=$(find android-kernel/bazel-bin -name "Image" -type f | head -n 1)
          
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: Compiled Kernel Image binary structure could not be found!"
            exit 1
          fi
          
          echo "Found kernel image target path at: $KERNEL_IMAGE"
          
          cp "$KERNEL_IMAGE" AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../AnyKernel3-NetHunter-GKI.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-NetHunter-GKI
          path: AnyKernel3-NetHunter-GKI.zip
          
