name: Build GKI Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel via Kleaf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          
          # Install 'repo' natively from Ubuntu repositories alongside building tools
          sudo apt-get install -y jq git curl python3 python-is-python3 repo rsync
          
          # Configure Git Identity (Mandatory requirement for repo init)
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize & Sync Kernel Source (GKI)
        run: |
          # 1. Parse manifest variables from repos.json using jq
          REPO_URL=$(jq -r '..repo // "https://googlesource.com"' repos.json)
          REPO_BRANCH=$(jq -r '..branch // "common-android14-6.1"' repos.json)
          
          echo "Initializing repo from: $REPO_URL on branch: $REPO_BRANCH"
          
          # 2. Create workspace directory structure
          mkdir -p android-kernel
          cd android-kernel
          
          # Initialize the Google GKI Manifest matching your chip arch
          repo init -u "$REPO_URL" -b "$REPO_BRANCH" --depth=1
          
          # Execute the source tree sync (Shallow clone to save space)
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Apply NetHunter Patch & Configs
        run: |
          # Verify directory exists before attempting tracking navigation
          if [ ! -d "android-kernel/common" ]; then
            echo "Error: The Google GKI repo sync did not complete successfully or common directory is missing."
            echo "Listing environment tree to debug:"
            ls -la
            exit 1
          fi

          cd android-kernel/common
          
          # Evaluate if NetHunter source patching is requested in repos.json
          DO_PATCH=$(jq -r '..nethunter_patch // false' $GITHUB_WORKSPACE/repos.json)
          
          if [ "$DO_PATCH" = "true" ]; then
              echo "Downloading and applying NetHunter patches..."
              git clone https://gitlab.com
              cd kali-nethunter-kernel
              ./patch.sh ..
              cd ..
          fi

          # Read and safely append configurations array from json to gki_defconfig mapping table
          jq -r '..extra_configs[]' $GITHUB_WORKSPACE/repos.json > extra_configs.txt
          
          echo "Appending the following configurations to arch/arm64/configs/gki_defconfig:"
          cat extra_configs.txt
          
          cat extra_configs.txt >> arch/arm64/configs/gki_defconfig
          
          # Clean up temporary configuration file
          rm extra_configs.txt

      - name: Build with Bazel (Kleaf)
        working-directory: android-kernel
        run: |
          # Extract custom bazel target parameters or default to standard aarch64 dist
          BAZEL_TARGET=$(jq -r '..bazel_target // "//common:kernel_aarch64_dist"' $GITHUB_WORKSPACE/repos.json)
          GKI_OVERRIDE=$(jq -r '..gki_certification_override // true' $GITHUB_WORKSPACE/repos.json)
          
          FLAGS=""
          if [ "$GKI_OVERRIDE" = "true" ]; then
             FLAGS="--//common:gki_certification=false"
          fi

          echo "Starting Hermetic Bazel build for target: $BAZEL_TARGET with flags: $FLAGS"
          
          # Execute compiler engine build strings
          tools/bazel build $FLAGS $BAZEL_TARGET

      - name: Prepare AnyKernel3 Packaging
        run: |
          # Clone standard flashing staging framework
          git clone https://github.com
          
          # Dynamically search deep inside bazel-bin to discover the compiled output binary
          KERNEL_IMAGE=$(find android-kernel/bazel-bin -name "Image" -type f | head -n 1)
          
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: Compiled Kernel Image binary structure could not be found!"
            exit 1
          fi
          
          echo "Found kernel image target path at: $KERNEL_IMAGE"
          
          # Stage the binary inside the flashing working folder
          cp "$KERNEL_IMAGE" AnyKernel3/
          
          # Package the payload
          cd AnyKernel3
          zip -r9 ../AnyKernel3-NetHunter-GKI.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-NetHunter-GKI
          path: AnyKernel3-NetHunter-GKI.zip
          
